# Cloud Build pipeline — builds the SSR Docker image and deploys to Cloud Run.
#
# Trigger via:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions _SERVICE_NAME={{PROJECT_NAME}},_REGION=us-central1
#
# Or wire to a GitHub trigger from the Cloud Build console.

steps:
  # 1. Build the SSR image with BuildKit (multi-stage, distroless final).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}:$SHORT_SHA
      - --tag=us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}:latest
      - --build-arg=NODE_VERSION=22
      - .

  # 2. Push to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}

  # 3. Deploy to Cloud Run. Autoscale-to-zero by default; tune in the
  #    Cloud Run console or pass `--min-instances=N` here for warm pools.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --concurrency=80
      - --timeout=60s

substitutions:
  _SERVICE_NAME: '{{PROJECT_NAME}}'
  _REGION: 'us-central1'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: '1200s'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}:$SHORT_SHA'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/apps/${_SERVICE_NAME}:latest'

name: Shared Setup

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: '24.x'
      fetch-depth:
        type: string
        required: false
        default: '0'
    secrets:
      GH_PACKAGES_TOKEN:
        required: true

jobs:
  setup:
    name: Setup Environment
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Setup pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/ship-pnpm" --no-audit --no-fund --ignore-scripts pnpm@10.34.6
          echo "$RUNNER_TEMP/ship-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        id: cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          printf '%s\n' '@sixthsummit:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/ship-package-step.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

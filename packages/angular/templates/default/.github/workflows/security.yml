name: Security

on:
  schedule:
    # Run security checks daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.x'

jobs:
  # Dependency vulnerability scanning
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/ship-pnpm" --no-audit --no-fund --ignore-scripts pnpm@10.34.6
          echo "$RUNNER_TEMP/ship-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          printf '%s\n' '@sixthsummit:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/ship-package-step.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  # License compliance check
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/ship-pnpm" --no-audit --no-fund --ignore-scripts pnpm@10.34.6
          echo "$RUNNER_TEMP/ship-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          printf '%s\n' '@sixthsummit:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/ship-package-step.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Check licenses
        run: |
          echo "Checking package licenses..."
          pnpm list --depth=0 --json | jq -r '.dependencies | to_entries[] | "\(.key): \(.value.license // "unknown")"' || true
          echo "License check completed"

  # Bundle size check
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        run: |
          npm install --prefix "$RUNNER_TEMP/ship-pnpm" --no-audit --no-fund --ignore-scripts pnpm@10.34.6
          echo "$RUNNER_TEMP/ship-pnpm/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          printf '%s\n' '@sixthsummit:registry=https://npm.pkg.github.com' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$NPM_CONFIG_USERCONFIG"
          trap 'rm -f "$NPM_CONFIG_USERCONFIG"' EXIT
          pnpm install --frozen-lockfile
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/ship-package-step.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Build production bundle
        run: pnpm build-prod

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Report"
          echo "Generated on: $(date)"
          echo ""
          if [ -d "dist" ]; then
            echo "### Total Size"
            du -sh dist/ || true
            echo ""
            echo "### File Breakdown"
            find dist -name "*.js" -exec ls -lh {} \; | awk '{print $5, $9}' | sort -h || true
          else
            echo "No dist directory found"
          fi

  # Security summary
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan, license-check, bundle-analysis]
    if: always()
    steps:
      - name: Security Summary
        run: |
          echo "## Security Scan Summary"
          echo "Dependency Scan: ${{ needs.dependency-scan.result }}"
          echo "License Check: ${{ needs.license-check.result }}"
          echo "Bundle Analysis: ${{ needs.bundle-analysis.result }}"

          if [[ "${{ needs.dependency-scan.result }}" == "failure" ]]; then
            echo "❌ Security scan failed - please review the results"
            exit 1
          else
            echo "✅ Security scan completed successfully"
          fi

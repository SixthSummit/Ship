repos:
  - repo: local
    hooks:
      - id: typescript-check
        name: TypeScript Check
        entry: npm run type-check
        language: system
        pass_filenames: false
        always_run: true

      - id: eslint
        name: ESLint
        entry: npm run lint
        language: system
        pass_filenames: false
        always_run: true

      - id: prettier-check
        name: Prettier Check
        entry: npm run format:check
        language: system
        pass_filenames: false
        always_run: true

      - id: tests
        name: Run Tests
        entry: npm run test
        language: system
        pass_filenames: false
        always_run: true

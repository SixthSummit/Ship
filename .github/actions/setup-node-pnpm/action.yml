name: Setup Node and pnpm
description: Install the repository-pinned pnpm version and restore its content-addressed cache

inputs:
  node-version:
    description: Node.js version used by repository automation
    required: false
    default: "22.23.4"

runs:
  using: composite
  steps:
    - name: Install pnpm from packageManager
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

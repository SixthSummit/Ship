name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Change and release plan
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.changes.outputs.api }}
      angular: ${{ steps.changes.outputs.angular }}
      apiDocs: ${{ steps.changes.outputs.apiDocs }}
      angularDocs: ${{ steps.changes.outputs.angularDocs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make Changesets base branch available
        run: git show-ref --verify --quiet refs/heads/dev || git branch dev origin/dev
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - id: changes
        name: Detect affected frameworks
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.sha }}
          CI_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/ci/plan.mjs
      - run: pnpm install --frozen-lockfile
      - run: node scripts/ci/check-workspace.mjs
      - run: pnpm exec vitest run scripts/ci/ scripts/release/
      - name: Preview pending package versions
        run: node scripts/ci/release-preview.mjs
      - name: Dependency security
        run: pnpm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: verification-and-release-plan
          path: |
            ci-plan.json
            release-plan.json
          retention-days: 14

  api:
    name: API verification
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:api

  angular:
    name: Angular and joint conformance
    needs: plan
    if: needs.plan.outputs.angular == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ship-angular exec playwright install --with-deps chromium
      - run: pnpm run ci:angular

  api-docs:
    name: API documentation
    needs: plan
    if: needs.plan.outputs.apiDocs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  angular-docs:
    name: Angular documentation
    needs: plan
    if: needs.plan.outputs.angularDocs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ship-angular format:check
      - run: pnpm --filter ship-angular docs:build

  ci-summary:
    name: CI Summary
    needs: [plan, api, angular, api-docs, angular-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require all selected checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/summary.mjs

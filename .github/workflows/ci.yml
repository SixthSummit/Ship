name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  CACHE_VERSION: v1

jobs:
  # Changesets pre mode is retired: dev publishes snapshot prereleases and main
  # publishes stable versions, so `.changeset/pre.json` must never exist on any
  # branch. A stray pre.json would make `changeset version` cut `-alpha.N`
  # prereleases (and a stable cut from main would silently ship another alpha).
  no-pre-mode:
    name: No changesets pre mode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify .changeset/pre.json is absent
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json exists. Pre mode is retired (dev publishes snapshots, main publishes stable); run 'pnpm exec changeset pre exit' and delete the file." >&2
            exit 1
          fi
          echo "No pre.json present; changesets pre mode is not active."

  # Lint and format check job
  lint-and-format:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome and architecture checks
        run: pnpm run check

      - name: Workspace package consistency
        run: |
          node -e "
            const fs = require('fs');
            const root = JSON.parse(fs.readFileSync('package.json'));
            const cfg = JSON.parse(fs.readFileSync('.changeset/config.json'));
            const ignored = new Set(cfg.ignore || []);
            const patterns = (root.workspaces || []).map(g => g + '/package.json');
            const wsFiles = patterns.flatMap(p => fs.globSync(p));
            const bad = [];
            for (const ws of wsFiles) {
              const pkg = JSON.parse(fs.readFileSync(ws));
              if (pkg.private === true) continue;
              if (ignored.has(pkg.name)) continue;
              if (pkg.publishConfig && pkg.publishConfig.registry) continue;
              bad.push(pkg.name + ' (' + ws + ')');
            }
            if (bad.length) {
              console.error('::error::Publishable packages missing publishConfig.registry (and not in .changeset/config.json ignore): ' + bad.join(', '));
              process.exit(1);
            }
            console.log('Workspace package consistency: OK');
          "

  # Type checking job
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package graph
        run: pnpm run api:build

      - name: Run TypeScript type check
        run: pnpm run api:type-check

  # Build verification job
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run api:build

      - name: Verify build output
        run: |
          for package in kernel hono drizzle contract cli auth-firebase observability-otel testing core mcp-server; do
            if [ ! -d "packages/$package/lib" ]; then
              echo "Build failed: packages/$package/lib directory not found"
              exit 1
            fi
          done
          echo "Build successful: all package outputs created"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/*/lib/
          retention-days: 7

  # Test job
  package-smoke:
    name: Packed consumer smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack, install, and boot the published surface
        run: pnpm run test:pack

      - name: Verify minimal golden consumer
        run: pnpm run test:consumer:minimal

      - name: Verify customized golden consumer
        run: pnpm run test:consumer:customized

      - name: Verify real joint fixture archive reproducibility
        run: |
          node scripts/build-joint-conformance.mjs --out "$RUNNER_TEMP/joint-first"
          node scripts/build-joint-conformance.mjs --out "$RUNNER_TEMP/joint-second"
          diff "$RUNNER_TEMP/joint-first/manifest.json" "$RUNNER_TEMP/joint-second/manifest.json"

      - name: Retain generated joint fixture candidate
        uses: actions/upload-artifact@v4
        with:
          name: ship-api-joint-conformance
          path: ${{ runner.temp }}/joint-first/

  # Test job
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package graph
        run: pnpm run api:build

      - name: Run tests
        run: pnpm run api:test

      - name: Direct and HTTP parity
        run: pnpm run test:parity

      - name: Run tests with coverage
        run: pnpm run api:test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

  # Real-Postgres integration tests — testcontainers spins up a
  # Postgres container per test suite; pushes the framework's
  # default schema via `drizzle-kit/api`'s pushSchema; exercises
  # DrizzleEntityService against the actual planner so SQL-level
  # behaviors (partial indexes, FK cascades, unique constraints,
  # soft-delete) are verified end-to-end. Excluded from the
  # default `pnpm test` loop (Docker-free, fast). See V4_STATUS G3.
  integration-tests:
    name: Integration tests (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package graph
        run: pnpm run api:build

      - name: Run integration tests
        run: pnpm run test:integration

  # Edge runtime smoke test — proves the framework's http/ layer
  # compiles for Cloudflare Workers. Catches Node-only-dep leakage
  # (pino / pg / bullmq / @opentelemetry/sdk-node) into the router
  # slice. See scripts/edge-smoke/README.md.
  edge-smoke:
    name: Edge runtime smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package graph
        run: pnpm run api:build

      - name: Wrangler dry-run
        run: pnpm run test:edge

      - name: Verify bundle output
        run: |
          if [ ! -f "scripts/edge-smoke/tmp/wrangler-out/worker.js" ] && \
             [ ! -f "scripts/edge-smoke/tmp/wrangler-out/index.js" ]; then
            echo "Edge smoke failed: no bundled worker output produced"
            ls -la scripts/edge-smoke/tmp/wrangler-out/ || true
            exit 1
          fi
          echo "Edge smoke: bundle produced, http/ layer is edge-clean"

  # Docs site build — runs `astro check && astro build` against the
  # apps/docs/ workspace. Catches broken cross-doc links + frontmatter
  # schema mismatches before merge. Built static site is uploaded as
  # an artifact (deploy hookup is deferred per docs-site iteration v1).
  docs-site:
    name: Docs Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter @sixthsummit/ship-api-docs run build

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site-dist
          path: apps/docs/dist/
          retention-days: 7

  # Skills sync drift detection — fails when a .cursor/rules/*.mdc
  # file changed without `pnpm run sync:skills` being re-run. Forces
  # SKILL.md authors to confirm the summary still reflects the rule.
  skills-sync:
    name: Skills sync (drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check skills drift
        run: node scripts/check-skills-sync.mjs

  # Published-runtime dependency gate. Dev tools and the docs application
  # have separate scheduled maintenance signals in security.yml.
  runtime-security:
    name: Runtime Dependency Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit framework runtime dependencies
        run: pnpm run audit:runtime

  # Check for migration files
  check-migrations:
    name: Check for Migration Files
    runs-on: ubuntu-latest
    outputs:
      has-migrations: ${{ steps.check.outputs.has-migrations }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for migration files
        id: check
        run: |
          # No migrations in the monorepo - they exist in user projects
          echo "has-migrations=false" >> $GITHUB_OUTPUT

  # Database migration check (if migrations exist)
  migration-check:
    name: Migration Check
    runs-on: ubuntu-latest
    needs: check-migrations
    if: needs.check-migrations.outputs.has-migrations == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check migration files syntax
        run: |
          # No migrations in the monorepo - they exist in user projects
          echo "Skipping migration check - no migrations in monorepo"

  # Summary job that depends on all other jobs
  angular:
    name: Angular and joint conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ship-angular exec playwright install --with-deps chromium
      - run: pnpm run api:build
      - run: pnpm exec tsx scripts/build-joint-conformance.mjs --out .ship/joint
      - run: pnpm --filter ship-angular run ci

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
        angular,
        no-pre-mode,
        lint-and-format,
        type-check,
        build,
        package-smoke,
        test,
        integration-tests,
        edge-smoke,
        docs-site,
        skills-sync,
        runtime-security,
        check-migrations,
        migration-check,
      ]
    if: always()
    steps:
      - name: Require successful mandatory jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            const optionalMigration = name === 'migration-check'
              && jobs['check-migrations'].result === 'success'
              && jobs['check-migrations'].outputs['has-migrations'] === 'false';
            if (job.result !== 'success' && !(optionalMigration && job.result === 'skipped')) {
              console.error(`Required job ${name} did not succeed: ${job.result}`);
              process.exitCode = 1;
            }
          }
          NODE
